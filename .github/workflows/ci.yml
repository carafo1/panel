# Checks every push and pull request before it can reach production.
#
#   typecheck   tsc over the whole project (next build refuses type errors)
#   lint        eslint (errors fail; existing warnings are allowed)
#   unit        tests/unit — pure functions, no database
#   scenarios   tests/scenarios — billing enforcement, team access, webhooks,
#               the job queue, uptime alerts, the worker and realtime
#               services; each run builds a throwaway SQLite database
#   build       next build, as production runs it
#
# Nothing here needs secrets: tests set their own throwaway values and never
# reach a real payment provider, registrar, mail server or VPS.
name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Scenario tests
        run: bun run test:scenarios

      # Route modules refuse to load without these, and next build loads them.
      # Throwaway values generated per run — never used anywhere else.
      - name: Build
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          bunx next build
        env:
          DATABASE_URL: file:./ci-build.db
          NEXT_TELEMETRY_DISABLED: '1'

  # Browser end-to-end tests of the main customer flows (tests/e2e): sign in,
  # every dashboard section, the website page, domain search, file upload,
  # the AI assistant, sign out. Runs the production build against a
  # throwaway SQLite database seeded by tests/e2e/seed.ts, with every
  # third-party key blank and all server work simulated (VPS_DEMO_MODE=1),
  # so it needs no secrets, Docker or SSH.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Built with the same env the test server runs with (tests/e2e/env.ts),
      # so NEXT_PUBLIC_* values match. The secrets in it are throwaway.
      - name: Build
        run: bun tests/e2e/build.ts

      # Playwright starts the server itself (webServer in playwright.config.ts):
      # tests/e2e/start-server.ts seeds the database, then runs `next start`.
      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
