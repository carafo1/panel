# Dependabot — automatic dependency updates
# Creates PRs when npm/Bun dependencies have security patches available

version: 2
updates:
  # JavaScript dependencies. CI and the installer use Bun, and CI installs with
  # `bun install --frozen-lockfile`, so updates must rewrite bun.lock. The
  # "npm" ecosystem only rewrote package-lock.json, which left bun.lock stale
  # and failed every Dependabot merge at the install step.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor + patch updates together to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Security updates are always created immediately (separate from schedule)
    # Ignore major updates (manual review required)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
