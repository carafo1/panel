#cloud-config
# ════════════════════════════════════════════════════════════════════════════
# Apsamo Panel — Cloud-Init Configuration (unattended VPS bootstrap)
# ════════════════════════════════════════════════════════════════════════════
#
#   This file is consumed by cloud-init on first boot. It installs Docker,
#   Caddy, Bun, Node, clones the panel, builds it, seeds the DB, creates
#   the admin user, and starts systemd services — all without SSH.
#
#   Usage:
#
#   1. Copy this file as user-data when creating a VPS at:
#        - Hetzner Cloud:   "User data" field
#        - DigitalOcean:    "User data" field
#        - Vultr:           "Startup Script" / "Cloud-Init" field
#        - AWS EC2:         "User data" when launching
#
#   2. Required env vars (set via #cloud-config write_files or pass as
#      instance metadata):
#        - APSAMO_BRAND_DOMAIN  — your apex domain (e.g. apsamo.com)
#        - APSAMO_ADMIN_EMAIL   — admin login email
#        - APSAMO_ADMIN_PASS    — admin password (min 8 chars)
#
#   3. Optional credentials (leave empty to run in demo mode):
#        - APSAMO_DYNADOT_API_KEY, APSAMO_DYNADOT_SECRET_KEY
#        - APSAMO_STRIPE_SECRET_KEY, APSAMO_STRIPE_WEBHOOK_SECRET
#        - APSAMO_SMTP_HOST, APSAMO_SMTP_PORT, APSAMO_SMTP_USER, APSAMO_SMTP_PASS
#        - APSAMO_MAILCOW_API_URL, APSAMO_MAILCOW_API_KEY
#        - APSAMO_GITHUB_CLIENT_ID, APSAMO_GITHUB_CLIENT_SECRET
#        - APSAMO_GITHUB_TOKEN (only if repo is private)
#
#   Total install time: ~10-15 minutes after first boot.
#   Tail the log:  ssh root@vps  →  tail -f /var/log/apsamo-install.log
# ════════════════════════════════════════════════════════════════════════════

# ─── Set hostname (will be the brand domain) ─────────────────────────────
# (Hetzner/DO already set a hostname; we override below in runcmd)

# ─── Write a placeholder .env.production file ─────────────────────────────
# This is read by the install script. Values can be overridden by instance
# metadata (preferred) or by editing this file before first boot.
write_files:
  - path: /root/apsamo-config.env
    permissions: '0600'
    owner: root:root
    content: |
      # ─── REQUIRED ──────────────────────────────────────────────────
      APSAMO_BRAND_DOMAIN=__SET_ME__
      APSAMO_ADMIN_EMAIL=__SET_ME__
      APSAMO_ADMIN_PASS=__SET_ME__

      # ─── OPTIONAL (leave blank for demo mode) ─────────────────────
      APSAMO_DYNADOT_API_KEY=
      APSAMO_DYNADOT_SECRET_KEY=
      APSAMO_STRIPE_SECRET_KEY=
      APSAMO_STRIPE_WEBHOOK_SECRET=
      APSAMO_STRIPE_PRICE_ID_DEFAULT=
      APSAMO_SMTP_HOST=
      APSAMO_SMTP_PORT=587
      APSAMO_SMTP_USER=
      APSAMO_SMTP_PASS=
      APSAMO_SMTP_FROM_NAME=Apsamo Panel
      APSAMO_MAILCOW_API_URL=
      APSAMO_MAILCOW_API_KEY=
      APSAMO_GITHUB_CLIENT_ID=
      APSAMO_GITHUB_CLIENT_SECRET=
      APSAMO_GITHUB_TOKEN=
      APSAMO_WAAFI_MERCHANT_ID=
      APSAMO_WAAFI_API_KEY=
      APSAMO_WAAFI_API_USER_ID=

      # ─── INSTALL OPTIONS ──────────────────────────────────────────
      APSAMO_INSTALL_MAILCOW=false
      APSAMO_REPO_URL=https://github.com/carafo1/panel.git
      APSAMO_REPO_BRANCH=main

# ─── Install packages early ──────────────────────────────────────────────
package_update: true
package_upgrade: true
packages:
  - curl
  - git
  - unzip
  - vim
  - less
  - build-essential
  - python3-dev
  - ufw
  - ca-certificates
  - gnupg
  - lsb-release
  - sqlite3
  - libsqlite3-dev
  - openssh-server
  - fail2ban
  - rsync

# ─── Run the installer ───────────────────────────────────────────────────
runcmd:
  # 1. Create install log
  - echo "=== Apsamo Panel cloud-init bootstrap started at $(date) ===" > /var/log/apsamo-install.log

  # 2. If config is missing required fields, fail fast
  - |
    if grep -q '__SET_ME__' /root/apsamo-config.env; then
      echo "[FATAL] Required config values not set. Edit /root/apsamo-config.env and re-run:" >> /var/log/apsamo-install.log
      echo "         nano /root/apsamo-config.env" >> /var/log/apsamo-install.log
      echo "         bash /opt/apsamo/deploy/cloud-init/bootstrap.sh" >> /var/log/apsamo-install.log
      exit 1
    fi

  # 3. Source config
  - set -a && . /root/apsamo-config.env && set +a

  # 4. Set hostname to brand domain
  - hostnamectl set-hostname "${APSAMO_BRAND_DOMAIN}" 2>/dev/null || echo "${APSAMO_BRAND_DOMAIN}" > /etc/hostname

  # 5. Install Docker (if not already)
  - |
    if ! command -v docker >/dev/null 2>&1; then
      echo "[bootstrap] installing Docker..." >> /var/log/apsamo-install.log
      curl -fsSL https://get.docker.com | sh >> /var/log/apsamo-install.log 2>&1
      systemctl enable --now docker >> /var/log/apsamo-install.log 2>&1
    fi

  # 6. Install Caddy (if not already)
  - |
    if ! command -v caddy >/dev/null 2>&1; then
      echo "[bootstrap] installing Caddy..." >> /var/log/apsamo-install.log
      apt-get install -y debian-keyring debian-archive-keyring apt-transport-https >> /var/log/apsamo-install.log 2>&1
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
        | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
        | tee /etc/apt/sources.list.d/caddy-stable.list > /dev/null
      apt-get update -qq >> /var/log/apsamo-install.log 2>&1
      apt-get install -y caddy >> /var/log/apsamo-install.log 2>&1
    fi

  # 7. Install Bun + Node (if not already)
  - |
    if ! command -v bun >/dev/null 2>&1; then
      echo "[bootstrap] installing Bun..." >> /var/log/apsamo-install.log
      curl -fsSL https://bun.sh/install | bash >> /var/log/apsamo-install.log 2>&1
      ln -sf /root/.bun/bin/bun /usr/local/bin/bun
    fi
  - |
    if ! command -v node >/dev/null 2>&1; then
      echo "[bootstrap] installing Node..." >> /var/log/apsamo-install.log
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >> /var/log/apsamo-install.log 2>&1
      apt-get install -y nodejs >> /var/log/apsamo-install.log 2>&1
    fi

  # 8. Clone the panel (handle private repo via token)
  - |
    if [ ! -d /opt/apsamo ]; then
      echo "[bootstrap] cloning panel repo..." >> /var/log/apsamo-install.log
      REPO_URL="${APSAMO_REPO_URL}"
      if [ -n "${APSAMO_GITHUB_TOKEN}" ]; then
        REPO_URL=$(echo "${APSAMO_REPO_URL}" | sed "s|https://github.com|https://${APSAMO_GITHUB_TOKEN}@github.com|")
      fi
      git clone -b "${APSAMO_REPO_BRANCH}" "${REPO_URL}" /opt/apsamo >> /var/log/apsamo-install.log 2>&1
    fi

  # 9. Run the install.sh in non-interactive mode
  - |
    cd /opt/apsamo
    echo "[bootstrap] running install.sh..." >> /var/log/apsamo-install.log

    BRAND_DOMAIN="${APSAMO_BRAND_DOMAIN}" \
    ADMIN_EMAIL="${APSAMO_ADMIN_EMAIL}" \
    ADMIN_PASSWORD="${APSAMO_ADMIN_PASS}" \
    INSTALL_MAILCOW=$([ "${APSAMO_INSTALL_MAILCOW}" = "true" ] && echo "y" || echo "n") \
    DYNADOT_API_KEY="${APSAMO_DYNADOT_API_KEY}" \
    STRIPE_SECRET_KEY="${APSAMO_STRIPE_SECRET_KEY}" \
    SMTP_HOST="${APSAMO_SMTP_HOST}" \
    SMTP_USER="${APSAMO_SMTP_USER}" \
    SMTP_PASS="${APSAMO_SMTP_PASS}" \
    bash /opt/apsamo/deploy/install.sh >> /var/log/apsamo-install.log 2>&1

  # 10. Apply optional credentials to .env (post-install patch)
  - |
    set -a && . /root/apsamo-config.env && set +a
    ENV=/opt/apsamo/.env
    [ -n "${APSAMO_DYNADOT_SECRET_KEY}" ]      && sed -i "s|^DYNADOT_SECRET_KEY=.*|DYNADOT_SECRET_KEY=\"${APSAMO_DYNADOT_SECRET_KEY}\"|" $ENV
    [ -n "${APSAMO_STRIPE_WEBHOOK_SECRET}" ]   && sed -i "s|^STRIPE_WEBHOOK_SECRET=.*|STRIPE_WEBHOOK_SECRET=\"${APSAMO_STRIPE_WEBHOOK_SECRET}\"|" $ENV
    [ -n "${APSAMO_STRIPE_PRICE_ID_DEFAULT}" ] && sed -i "s|^STRIPE_PRICE_ID_DEFAULT=.*|STRIPE_PRICE_ID_DEFAULT=\"${APSAMO_STRIPE_PRICE_ID_DEFAULT}\"|" $ENV
    [ -n "${APSAMO_MAILCOW_API_URL}" ]         && sed -i "s|^MAILCOW_API_URL=.*|MAILCOW_API_URL=\"${APSAMO_MAILCOW_API_URL}\"|" $ENV
    [ -n "${APSAMO_MAILCOW_API_KEY}" ]         && sed -i "s|^MAILCOW_API_KEY=.*|MAILCOW_API_KEY=\"${APSAMO_MAILCOW_API_KEY}\"|" $ENV
    [ -n "${APSAMO_GITHUB_CLIENT_ID}" ]        && sed -i "s|^GITHUB_CLIENT_ID=.*|GITHUB_CLIENT_ID=\"${APSAMO_GITHUB_CLIENT_ID}\"|" $ENV
    [ -n "${APSAMO_GITHUB_CLIENT_SECRET}" ]    && sed -i "s|^GITHUB_CLIENT_SECRET=.*|GITHUB_CLIENT_SECRET=\"${APSAMO_GITHUB_CLIENT_SECRET}\"|" $ENV
    [ -n "${APSAMO_WAAFI_MERCHANT_ID}" ]       && sed -i "s|^WAAFI_MERCHANT_ID=.*|WAAFI_MERCHANT_ID=\"${APSAMO_WAAFI_MERCHANT_ID}\"|" $ENV
    [ -n "${APSAMO_WAAFI_API_KEY}" ]           && sed -i "s|^WAAFI_API_KEY=.*|WAAFI_API_KEY=\"${APSAMO_WAAFI_API_KEY}\"|" $ENV
    [ -n "${APSAMO_WAAFI_API_USER_ID}" ]       && sed -i "s|^WAAFI_API_USER_ID=.*|WAAFI_API_USER_ID=\"${APSAMO_WAAFI_API_USER_ID}\"|" $ENV
    [ -n "${APSAMO_SMTP_PORT}" ]               && sed -i "s|^SMTP_PORT=.*|SMTP_PORT=\"${APSAMO_SMTP_PORT}\"|" $ENV
    [ -n "${APSAMO_SMTP_FROM_NAME}" ]          && sed -i "s|^SMTP_FROM_NAME=.*|SMTP_FROM_NAME=\"${APSAMO_SMTP_FROM_NAME}\"|" $ENV

    # Restart panel to pick up new env vars
    systemctl restart apsamo-panel apsamo-realtime apsamo-worker

  # 11. Create localhost server in DB (for single-box deployment)
  - |
    cd /opt/apsamo
    bun -e "
    const { db } = require('./src/lib/db');
    (async () => {
      const existing = await db.server.findFirst({ where: { sshHost: 'localhost' } });
      if (existing) { console.log('localhost server already exists'); process.exit(0); }
      await db.server.create({
        data: {
          name: 'Localhost (this server)',
          ip: '127.0.0.1',
          provider: 'local',
          status: 'active',
          cpuCores: $(nproc),
          ramGB: $(awk '/MemTotal/ {printf \"%d\", \$2/1024/1024}' /proc/meminfo),
          storageGB: $(df -BG / | awk 'NR==2 {gsub(/G/, \"\", \$2); print \$2}'),
          bandwidthGB: 1000,
          usedRamGB: 0,
          usedStorageGB: 0,
          region: 'local',
          sshHost: 'localhost',
          sshPort: 22,
          sshUser: 'root',
          dockerInstalled: true,
          caddyInstalled: true,
          healthStatus: 'healthy',
        },
      });
      console.log('localhost server created');
      process.exit(0);
    })();
    " >> /var/log/apsamo-install.log 2>&1

  # 12. Set up off-site backup sync (optional — requires rclone configured)
  - |
    if command -v rclone >/dev/null 2>&1; then
      (crontab -l 2>/dev/null || true; echo "0 4 * * * rclone copy /opt/apsamo/backups/ remote:apsamo-backups/ >> /var/log/apsamo-backup-sync.log 2>&1") | crontab -
      echo "[bootstrap] off-site backup sync scheduled (rclone)" >> /var/log/apsamo-install.log
    fi

  # 13. Done
  - |
    IP=$(curl -s -4 https://ifconfig.me 2>/dev/null || hostname -I | awk '{print $1}')
    echo "" >> /var/log/apsamo-install.log
    echo "════════════════════════════════════════════════════════════════" >> /var/log/apsamo-install.log
    echo "  APSAMO PANEL — CLOUD-INIT BOOTSTRAP COMPLETE" >> /var/log/apsamo-install.log
    echo "════════════════════════════════════════════════════════════════" >> /var/log/apsamo-install.log
    echo "  URL:      https://${APSAMO_BRAND_DOMAIN}" >> /var/log/apsamo-install.log
    echo "  IP:       ${IP}" >> /var/log/apsamo-install.log
    echo "  Email:    ${APSAMO_ADMIN_EMAIL}" >> /var/log/apsamo-install.log
    echo "  Log:      /var/log/apsamo-install.log" >> /var/log/apsamo-install.log
    echo "  Manage:   apsamo status" >> /var/log/apsamo-install.log
    echo "════════════════════════════════════════════════════════════════" >> /var/log/apsamo-install.log

# ─── Configure firewall (deferred to install.sh, but ensure ufw is enabled) ──
# (install.sh handles the full ufw config)

# ─── SSH key (optional — replace with your public key) ───────────────────
# ssh_authorized_keys:
#   - ssh-rsa AAAAB3NzaC1yc2E... your@email
